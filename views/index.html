<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/form.js" defer></script>
</head>

<body>
  <form id="contact-form" novalidate>
    <h1>Contact Form</h1>

    <div class="group">
      <label for="first">First Name <input type="text" id="first" name="first"></label>
      <span class="error" id="first-error">First name is required.</span>
    </div>

    <div class="group">
      <label for="last">Last Name <input type="text" id="last" name="last"></label>
      <span class="error" id="last-error">Last name is required.</span>
    </div>

    <label for="job">Job Title <input type="text" id="job" name="job"></label>

    <label for="company">Company <input type="text" id="company" name="company"></label>

    <div class="group">
      <label for="linkedin">LinkedIn URL <input type="url" id="linkedin" name="linkedin"></label>
      <span class="error" id="linkedin-error">Please enter a valid LinkedIn address.</span>
    </div>

    <div class ="group">
      <label for="email">Email Address <input type="email" id="email" name="email"></label>
      <span class="error" id="email-error">Please enter a valid email address.</span>
      <span class="error" id="mailing-error">Please enter an email address.</span>
    </div>


    
    <label for="meet" class="half">How did we meet?
      <span class="error" id="meet-error">Please Select How We Met</span>
      <select id="meet" name="meet">
        <option value="none">Please select</option>
        <option value ="School">School</option>
        <option value ="Hackathon">Hackathon</option>
        <option value ="Conference">Conference</option>
        <option value ="Other">Other</option>
      </select>
    </label>

    <div id="met">
      <label for="other" class="half">
          Other (please specify) 
          <input type="text" id="other" name="other">
      </label>
    </div>

    <label for="message" class="full">
        Message 
        <textarea id="message" name="message" rows="4"></textarea>
    </label>

    <label for="mailing" class="full check">
        <input type="checkbox" id="mailing" name="mailing"> 
        Please add me to your mailing list
    </label>

    <p class="full check">Choose an email format:
      <input type="radio" id="html" name="format" value="html" checked> 
      <label for="html">HTML</label>

      <input type="radio" id="text" name="format" value="text"> 
      <label for="text">Text</label>
    </p>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
